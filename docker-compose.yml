version: '3.8'

services:
  muse2api:
    build:
      context: .
      args:
        # Must match the owner of ./data on the host. On an existing install created by
        # the old root image, run: sudo chown -R $(id -u):$(id -g) data
        UID: ${MUSE2API_UID:-1000}
        GID: ${MUSE2API_GID:-1000}
    image: muse2api:latest
    container_name: muse2api
    restart: always
    ports:
      - "18610:18610"
    environment:
      # Admin and API authentication key (read from .env or the host environment; auto-generated when empty)
      - MUSE2API_KEY=${MUSE2API_KEY:-}
      # Public base URL for the service, e.g. https://your-domain.com (empty: the admin frontend detects the current origin)
      - MUSE2API_PUBLIC_BASE=
      # Timeout settings (seconds)
      - MUSE2API_IMAGE_TIMEOUT=240
      - MUSE2API_VIDEO_TIMEOUT=600
      - MUSE2API_CHAT_TIMEOUT=300
    volumes:
      # Persist account configuration, task logs, and media files
      - ./data:/app/data
    shm_size: '2gb' # Prevent Chromium from crashing on /dev/shm exhaustion when rendering multiple tabs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18610/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
